apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagship-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flagship-api
  template:
    metadata:
      labels:
        app: flagship-api
    spec:
      containers:
        - name: api
          image: flagship-api:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi